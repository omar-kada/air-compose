services:
  air-compose:
    extends:
      file: compose.yaml
      service: air-compose
    build: .
    image: air-compose:local
    environment:
      ENV: "${ENV:-DEV}"
      AIR_COMPOSE_ADD_WRITE_PERM: "${AIR_COMPOSE_ADD_WRITE_PERM:-true}"
      AIR_COMPOSE_DISPLAY_CMD_LOGS: "${AIR_COMPOSE_DISPLAY_CMD_LOGS:-true}"
      AIR_COMPOSE_DOCKER_IMAGE: "air-compose:local"
      AIR_COMPOSE_LOG_LEVEL: "DEBUG"
      AIR_COMPOSE_HUMAN_LOG: "TRUE"