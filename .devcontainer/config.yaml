# air-compose demo configuration
# Mounted at /data/config.yaml inside the container
# Edit any field to customize your demo — changes are saved on disk.

settings:
  git:
    repo: "https://github.com/omar-kada/air-compose-config"
    branch: "main"
  schedule:
    cron: "@hourly"
    retriesOnUnhealthy: 3
    retryDelay: 30000
  notifications: {}
  oidc: {}

environment:
  TZ: "UTC"

services: {}
